server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nén tĩnh
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Service worker + script đăng ký: TUYỆT ĐỐI không cache. Trước đây 2 file này rơi
  # vào `location /` nên Cloudflare tự cache 4 tiếng → trình duyệt đi kiểm tra bản mới
  # vẫn nhận lại sw.js cũ, app kẹt ở bundle cũ sau mỗi lần deploy.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires -1;
    try_files $uri =404;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
    try_files $uri =404;
  }

  # index.html cũng không được cache — nó trỏ tới asset có hash, cache là kẹt bản cũ.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
  }

  # Asset có hash → cache vĩnh viễn. ^~ để regex bên dưới KHÔNG chiếm location này.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Asset tĩnh ở root (icon, manifest, og-image...): thiếu thì 404 — KHÔNG fallback index.html.
  # Tránh file chưa tồn tại bị trả HTML rồi Cloudflare cache nhầm dưới URL asset.
  location ~* \.(svg|png|ico|jpg|jpeg|webp|webmanifest|json|txt|xml)$ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  # SPA: route còn lại fallback index.html (app dùng hash router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
